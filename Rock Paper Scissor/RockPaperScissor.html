<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./RockPaperScissor.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Rock Paper Scissor Game</title>
</head>
<body>
    <p class="heading">Rock Paper Scissors</p>
    
    <button class="rock">
    <img id="rock-img" src="./rock-emoji.png" alt="">
    </button>
    
    <button class="paper">
    <img id="paper-img" src="./paper-emoji.png" alt="">
    </button>
    
    <button class="scissors">
    <img id="scissors-img" src="./scissors-emoji.png" alt="">
    </button>
    
    <p id="declare"></p>
    
    <button class="reset">Reset Score</button>
    <button class="auto-stop">Auto Play</button>
    <script src="./RockPaperScissor.js"></script>
</body>
</html>
